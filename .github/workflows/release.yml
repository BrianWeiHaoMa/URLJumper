# A tag v<version>: every check on the tagged commit, a check that the tag names the manifest's version, and a
# GitHub release carrying release/URLJumper.zip, the Web Store upload, with the version's CHANGELOG.md section
# as its notes. RELEASING.md says what comes before and after.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e
      - name: Check that the tag names the manifest's version
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8')).version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME but the manifest's version is $version"
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section headed '## $version'"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/URLJumper.zip --title "URLJumper ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
