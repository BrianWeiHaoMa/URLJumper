# A tag v<version>: every check on the tagged commit, a check that the tag names the manifest's version, and a
# GitHub release carrying release/URLJumper.zip, the Web Store upload. RELEASING.md says what comes before and after.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e
      - name: Check that the tag names the manifest's version
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8')).version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME but the manifest's version is $version"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/URLJumper.zip --title "URLJumper ${GITHUB_REF_NAME#v}" --notes "The changes are listed under this version in CHANGELOG.md."
